spring:
  application:
    name: ved-backend
  datasource:
    url: ${VED_DB_URL:jdbc:postgresql://localhost:5433/ved}
    username: ${VED_DB_USERNAME:ved}
    password: ${VED_DB_PASSWORD:ved}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      # Keep in sync with ved.documents.max-size-bytes (the policy check gives the nicer error).
      max-file-size: 25MB
      max-request-size: 26MB
  threads:
    virtual:
      enabled: true

server:
  port: ${VED_PORT:8080}
  error:
    include-message: never

logging:
  pattern:
    # Every line carries the request id (X-Request-Id), shared with the inference service's logs.
    level: "%5p [%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info

ved:
  security:
    jwt:
      # HS256 signing key, at least 32 bytes. MUST be overridden outside local development.
      secret: ${VED_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
      issuer: ved
      access-token-ttl: 15m
    refresh-token:
      ttl: 14d
      cookie-name: ved_refresh
      cookie-path: /api/auth
      cookie-secure: ${VED_COOKIE_SECURE:false}
      cookie-same-site: Strict
    cors:
      allowed-origins: ${VED_CORS_ORIGINS:http://localhost:5173}
  documents:
    storage-dir: ${VED_STORAGE_DIR:./var/storage}
    max-size-bytes: 26214400 # 25 MiB
    processing:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 200
      # Transient failures (AI busy / out of quota) retry automatically after these delays, resuming where
      # they stopped. One entry per attempt; empty disables automatic retries.
      auto-retry-delays: 1m, 4m, 15m
      retry-poll: 30s # how often due retries (and abandoned documents) are picked up
      # Multi-instance safety: a document is claimed by one instance, which refreshes a heartbeat while working
      # on it. If the heartbeat is older than this (crash, scale-down), any instance requeues the document.
      lease: 2m
  knowledge:
    # Signs figure image URLs. MUST be overridden outside local development.
    figure-url-secret: ${VED_FIGURE_URL_SECRET:dev-only-figure-url-secret-change-me}
    figure-url-ttl: 6h
    retrieval:
      candidates: 30 # per ranker (keyword, vector) before fusion
      # Weighted Reciprocal Rank Fusion: score = sum of weight / (k + rank). Tuned with
      # inference/scripts/eval_embeddings.py on 268 student questions (natural and reworded) over our documents:
      # trusting meaning search twice as much as keywords, with a small k, raised the right passage at #1 from
      # 80% to 85% (natural) and 76% to 79% (reworded), keeping ~99% / 93% in the top 3. See configuration.md.
      rrf-k: 10
      keyword-weight: 1.0
      vector-weight: 2.0
      # Cosine similarity a figure needs to count as a semantic match (keyword matches on captions always count).
      # Model-specific: calibrated on gemini-embedding-2 (on-topic figures ~0.52-0.56, loosely related ~0.42-0.46,
      # unrelated ~0.36-0.38). Re-tune when switching embedding models.
      figure-min-similarity: 0.48
    # Study units of the Preview: the sections that get Expand / Revision. A unit is the highest section whose
    # whole subtree has between min and max characters of text; keep max below ved.study.context.notes.chars.
    reading:
      unit-min-chars: 300   # below this, a rewrite adds nothing (a title line, two bullets)
      unit-max-chars: 6000  # ~2-4 textbook pages: a 5-10 minute read, like a lesson
    indexing:        # items per inference call; each batch commits, so failures resume from the last batch
      figure-batch: 12
      summary-batch: 36
      chunk-embed-batch: 96
      figure-embed-batch: 16
      summary-text-chars: 6000 # source text per section sent for summarising
  study:
    # Characters of retrieved source text (and max figures) sent to the model per use.
    context:
      lesson:    { chars: 24000, figures: 6 }
      questions: { chars: 12000, figures: 0 }
      grade:     { chars: 6000,  figures: 0 }
      tutor:     { chars: 10000, figures: 2 }
      ask:       { chars: 14000, figures: 5 }
      notes:     { chars: 18000, figures: 5 }
  inference:
    base-url: ${VED_INFERENCE_URL:http://localhost:8000}
    api-key: ${VED_INFERENCE_API_KEY:dev-internal-key}
    connect-timeout: 5s
    read-timeout: 20m
