spring:
  application:
    name: ved-backend
  datasource:
    url: ${VED_DB_URL:jdbc:postgresql://localhost:5433/ved}
    username: ${VED_DB_USERNAME:ved}
    password: ${VED_DB_PASSWORD:ved}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      # Keep in sync with ved.documents.max-size-bytes (the policy check gives the nicer error).
      max-file-size: 25MB
      max-request-size: 26MB
  threads:
    virtual:
      enabled: true

server:
  port: ${VED_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

ved:
  security:
    jwt:
      # HS256 signing key, at least 32 bytes. MUST be overridden outside local development.
      secret: ${VED_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
      issuer: ved
      access-token-ttl: 15m
    refresh-token:
      ttl: 14d
      cookie-name: ved_refresh
      cookie-path: /api/auth
      cookie-secure: ${VED_COOKIE_SECURE:false}
      cookie-same-site: Strict
    cors:
      allowed-origins: ${VED_CORS_ORIGINS:http://localhost:5173}
  documents:
    storage-dir: ${VED_STORAGE_DIR:./var/storage}
    max-size-bytes: 26214400 # 25 MiB
    processing:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 200
  inference:
    base-url: ${VED_INFERENCE_URL:http://localhost:8000}
    api-key: ${VED_INFERENCE_API_KEY:dev-internal-key}
    connect-timeout: 5s
    read-timeout: 20m
