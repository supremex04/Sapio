[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ved-inference"
version = "0.1.0"
description = "Ved inference service: OCR / document-to-Markdown (and future AI features)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings[yaml]>=2.4",
    "python-dotenv>=1.0",
    "pymupdf>=1.27",
    "pymupdf4llm>=1.27",
    "pillow>=11",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
# CPU OCR engine that runs anywhere (default for local development).
rapid = ["rapidocr_onnxruntime>=1.4"]
# Unlimited-OCR in-process via transformers. Needs an NVIDIA GPU with ~8 GB+ VRAM.
# Versions pinned to what the model card was tested with.
local = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers==4.57.1",
    "einops==0.8.2",
    "addict==2.4.0",
    "easydict==1.13",
    "matplotlib==3.10.8",
    "psutil>=7",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["slow: runs a real OCR model"]

[tool.ruff]
line-length = 110
target-version = "py312"
