[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sapio-renderer"
version = "0.1.0"
description = "Sapio renderer: turns checked Manim scene code into a video, in a locked-down container (no AI, no secrets)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Manim needs system libraries (Cairo, Pango, ffmpeg, LaTeX) and Kokoro its model files: both in the Docker image.
manim = ["manim==0.19.0", "kokoro-onnx==0.6.1", "rdkit==2026.3.6", "scipy>=1.13"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "numpy>=2", "scipy>=1.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["render: renders a real video (needs Manim, run in the Docker image)"]

[tool.ruff]
line-length = 110
target-version = "py312"
