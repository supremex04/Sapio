[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/ved-supervisord.pid
user=1000

[program:postgres]
command=/usr/lib/postgresql/17/bin/postgres -D /data/postgres -h 127.0.0.1 -k /tmp -p 5432
priority=10
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:inference]
command=/usr/local/bin/uvicorn ved_inference.main:app --host 127.0.0.1 --port 8000
directory=/app
environment=VED_INFERENCE_CONFIG="/app/inference/settings.yaml"
priority=20
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:backend]
command=/app/space-backend-start.sh
priority=30
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=40
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
